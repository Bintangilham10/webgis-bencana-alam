# Database PostGIS untuk pengembangan lokal: docker compose up -d
services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: sigap
      POSTGRES_USER: sigap
      POSTGRES_PASSWORD: sigap
    ports:
      # 5433 supaya tidak bentrok dengan PostgreSQL lain yang mungkin terpasang.
      - "5433:5432"
    volumes:
      # Mulai Postgres 18, volume dipasang di /var/lib/postgresql (bukan .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigap -d sigap"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
