#cloud-config
# Persiapan VM Ubuntu 24.04 untuk SIGAP Bencana (az vm create --custom-data).
# Docker dan Compose dari repositori Ubuntu, swap 2 GB karena RAM VM hanya 1 GB, lalu
# kode diambil dari GitHub. Basis data dan deploy/.env diisi sesudahnya (deploy/README.md).

# DNS publik sebagai cadangan DNS Azure. Pada 11 Nov 2026 DNS Azure di malaysiawest tidak
# menjawab domain Canonical, sehingga Docker gagal dipasang. bootcmd berjalan sebelum
# pemasangan paket.
bootcmd:
  - mkdir -p /etc/systemd/resolved.conf.d
  - printf '[Resolve]\nDNS=1.1.1.1 8.8.8.8\n' > /etc/systemd/resolved.conf.d/10-sigap-dns.conf
  - systemctl restart systemd-resolved
package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - git
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker azureuser
  - git clone https://github.com/Bintangilham10/webgis-bencana-alam.git /opt/sigap
  - chown -R azureuser:azureuser /opt/sigap
