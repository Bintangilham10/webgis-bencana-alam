# Server produksi SIGAP Bencana: PostGIS, API Express, dan Caddy (peta web + HTTPS).
# Dari root repo:  docker compose -f deploy/compose.yaml up -d --build
# Nilai rahasia di deploy/.env (salin dari deploy/.env.example). Panduan: deploy/README.md.
name: sigap

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigap
      POSTGRES_USER: sigap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql
    # Hanya dari mesin ini (mis. tunnel SSH untuk riset), tidak dari internet.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigap -d sigap"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sigap:${POSTGRES_PASSWORD}@db:5432/sigap
      # "off" mematikan sinkronisasi terjadwal (mis. saat menguji image di laptop).
      SCHEDULER: ${SCHEDULER:-on}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?isi SITE_ADDRESS di deploy/.env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
