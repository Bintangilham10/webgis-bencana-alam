<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 64 64" role="img" aria-label="SIGAP Bencana">
  <title>SIGAP Bencana</title>
  <!-- Versi untuk latar gelap dari logo-light.svg: garis biru muda. -->
  <style>
    .line {
      fill: none;
      stroke: #79aaff;
      stroke-width: 3.2px;
      stroke-linecap: round;
      stroke-dasharray: 1 2;
      stroke-dashoffset: 0;
      animation: draw 0.9s cubic-bezier(0.22, 1, 0.36, 1) both, wave 4.8s linear infinite;
    }
    .l1 { animation-delay: 0.2s, 1.25s; }
    .l2 { animation-delay: 0.32s, 1.4s; }
    .l3 { animation-delay: 0.44s, 1.55s; }
    .dot {
      fill: #f59e0b;
      transform-box: fill-box;
      transform-origin: center;
      animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both, beat 4.8s ease-out 1.2s infinite;
    }
    .ring {
      fill: none;
      stroke: #f59e0b;
      stroke-width: 1.4px;
      vector-effect: non-scaling-stroke;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: ping 4.8s cubic-bezier(0.22, 1, 0.36, 1) 1.2s infinite;
    }
    @keyframes draw { from { stroke-dashoffset: 1.01; } }
    @keyframes wave { 0%, 12%, 100% { stroke: #79aaff; } 5% { stroke: #d6e4ff; } }
    @keyframes pop { from { transform: scale(0); } }
    @keyframes beat { 0% { transform: scale(1.3); } 10%, 100% { transform: scale(1); } }
    @keyframes ping { 0% { opacity: 0.9; transform: scale(1); } 22%, 100% { opacity: 0; transform: scale(4.6); } }
    @media (prefers-reduced-motion: reduce) {
      .line, .dot, .ring { animation: none; }
    }
  </style>
  <circle class="ring" cx="32" cy="22" r="2.7"/>
  <path class="line l1" pathLength="1" d="M36.07 19.46A4.8 4.8 0 1 0 32 26.8A15.2 15.2 0 1 1 19.11 50.05"/>
  <path class="line l2" pathLength="1" d="M40.48 16.7A10 10 0 1 0 32 32A10 10 0 1 1 23.52 47.3"/>
  <path class="line l3" pathLength="1" d="M44.89 13.95A15.2 15.2 0 1 0 32 37.2A4.8 4.8 0 1 1 27.93 44.54"/>
  <circle class="dot" cx="32" cy="22" r="2.7"/>
</svg>
